spring.application.name=pet-sitter

server.port=${PORT:8083}
server.address=0.0.0.0

logging.level.org.springframework=INFO
logging.level.com.techup=${APP_LOG_LEVEL:INFO}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Supabase pooler (PgBouncer transaction mode) doesn't support server-side prepared statements
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}

supabase.url=${SUPABASE_URL}
supabase.bucket=${SUPABASE_BUCKET:uploads}
supabase.apiKey=${SUPABASE_API_KEY:}
# Access tokens are verified via Supabase JWKS (ES256).

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.mvc.problemdetails.enabled=true
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:https://pet-sitter-client-one.vercel.app,http://localhost:*,http://127.0.0.1:*}

spring.config.import=optional:classpath:application-local.properties
stripe.secret.key=${STRIPE_SECRET_KEY:}
